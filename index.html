<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio VR AR Experience</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#111;
overflow:hidden;
font-family:Arial,sans-serif;
}

h1{
position:absolute;
top:10px;
width:100%;
text-align:center;
color:white;
z-index:10;
}

model-viewer{
width:100vw;
height:100vh;
}

</style>

</head>

<body>

<h1>Radio VR AR Experience</h1>

<model-viewer
src="radio_studio.glb"
ar
camera-controls
auto-rotate
shadow-intensity="1">
</model-viewer>

</body>
</html>
